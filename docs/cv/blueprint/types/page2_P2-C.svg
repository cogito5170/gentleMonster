<text x="12.00" y="28.00" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.611" font-weight="700" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="1">지원한 이유, 왜 젠틀몬스터여야 하는가?</text>
