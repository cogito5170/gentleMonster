<text x="12.00" y="215.24" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="5.292" font-weight="200" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="1">02</text>
<text x="23.00" y="212.64" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.835" font-weight="600" fill="#8E8B86" text-anchor="start" letter-spacing="0.300" opacity="1">ABOUT ME · STRENGTHS</text>
<text x="23.00" y="216.64" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.611" font-weight="700" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="1">본인을 소개하시오. 자신의 강점은 무엇입니까?</text>
<text x="100.00" y="212.64" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="1.693" font-weight="400" fill="#8E8B86" text-anchor="end" letter-spacing="0.000" opacity="1">1156자</text>
<text x="12.00" y="226.64" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="3.704" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="1">〈틀을 배우고, 그 안을 채우는 건축학도〉</text>
<text x="12.00" y="236.67" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.662" font-weight="700" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="1">① 본인 소개</text>
<text x="12.00" y="242.89" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">건물을 설계하던 감각으로 매장을 설계하려는 건축학도입니다. 5년제</text>
<text x="12.00" y="247.87" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">건축학과의 설계 수업에서 다룬 건축은 대지와 주변 건물과의 관계 속에서</text>
<text x="12.00" y="252.84" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">&#x27;틀&#x27;을 정하는 일이었습니다. 그 틀 안의 실내 공간을 다룰 때 더 큰 흥미를</text>
<text x="12.00" y="257.82" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">느껴, 4학년 2학기에 휴학하고 공간 디자인으로 전향해 젠틀몬스터에</text>
<text x="12.00" y="262.80" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">지원했습니다.</text>
<text x="12.00" y="272.25" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.662" font-weight="700" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="1">② 강점</text>
<text x="110.00" y="48.89" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">첫째, 기획입니다. 1학년부터 매 학기, 7학기 동안 설계 수업에서 리서치와</text>
<text x="110.00" y="53.87" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">분석으로 컨셉을 세우고 그 컨셉을 건물로 발전시켰습니다. 하나의 생각을</text>
<text x="110.00" y="58.84" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">끝까지 형태로 밀고 가는 이 과정을 공간 기획에 가져가겠습니다.</text>
<text x="110.00" y="66.56" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">둘째, 구현과 소통입니다. 수업에서는 컨셉을 다이어그램과 이미지로 옮겨</text>
<text x="110.00" y="71.53" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">발표했습니다. 건축사사무소 인턴으로는 현장을 실측해 모델링하고, 주변</text>
<text x="110.00" y="76.51" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">대지와 프로젝트 건물을 구현했습니다. 2D부터 3D 모델링, 시각화,</text>
<text x="110.00" y="81.49" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">후보정까지 다룹니다. 오토캐드, 라이노, 엔스케이프, 포토샵, 일러스트,</text>
<text x="110.00" y="86.46" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">인디자인을 씁니다. 매장 컨셉도 같은 방식으로 모델과 이미지로 옮겨</text>
<text x="110.00" y="91.44" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">전하겠습니다.</text>
<text x="110.00" y="99.15" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">셋째, 디자인적 감각입니다. 건축가도 디자이너라는 생각으로 시야를 넓혀</text>
<text x="110.00" y="104.13" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">왔습니다. 학부 과정에서는 건물의 비례, 이미지 표현, 색채를 다듬는</text>
<text x="110.00" y="109.10" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">작업을 지향했고, 다양한 건축물을 다니며 실내 공간을 이루는 마감재와</text>
<text x="110.00" y="114.08" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">가구, 조명을 살폈습니다.</text>
<text x="110.00" y="121.79" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">원색 대신 채도를 낮춘 색으로 포인트를 주고 주변과 어우러지게 해, 가구와</text>
<text x="110.00" y="126.77" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">조명 같은 오브제가 공간 속에서 하나의 장면이 되게 하는 방식에 관심이</text>
<text x="110.00" y="131.74" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">많습니다. 이 감각을 아트 오브제와 가구, 마감재를 기획하는 데</text>
<text x="110.00" y="136.72" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">쓰겠습니다.</text>
<text x="110.00" y="144.43" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">절제된 비례와 색 조합에는 익숙합니다. 학부 시절 건축을 통해 절제된</text>
<text x="110.00" y="149.41" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">디자인을 배워 왔기 때문입니다. 반면 과감한 디자인은 아직 익숙하지 않아,</text>
<text x="110.00" y="154.38" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">그쪽으로 폭을 넓혀 가려 합니다. 젠틀몬스터의 공간은 과감한 형태와 색의</text>
<text x="110.00" y="159.36" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">디자인 언어를 쓰기에, 그 언어 앞에서는 채워야 할 부분입니다. 그</text>
<text x="110.00" y="164.33" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">일환으로서 스타일부터 변화하고 있습니다. 무채색 기반의 패션을 컬러</text>
<text x="110.00" y="169.31" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">포인트와 개성 있는 아이템으로 바꿔나가고 있습니다. 옷에서 시작한 이</text>
<text x="110.00" y="174.29" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">변화를 실무까지 이어 가고 싶습니다. 건축에서 익힌 절제 위에 과감을 더해,</text>
<text x="110.00" y="179.26" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.893" font-weight="400" fill="#ECE8E1" text-anchor="start" letter-spacing="0.000" opacity="0.92">절제와 과감을 한 공간에서 함께 다루고자 합니다.</text>
