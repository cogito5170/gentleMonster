<text x="195.38" y="11.68" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.623" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="0.200" opacity="1">CONTACT</text>
<rect x="163.35" y="8.80" width="23.00" height="4.60" rx="0.8" fill="#141414" stroke="none" stroke-width="0.25"/>
<text x="174.85" y="11.90" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.623" font-weight="600" fill="#E6E2DA" text-anchor="middle" letter-spacing="0.200" opacity="1">COVER LETTER</text>
<rect x="148.25" y="8.80" width="13.70" height="4.60" rx="0.8" fill="#DAD5CB" stroke="none" stroke-width="0.25"/>
<text x="155.10" y="11.90" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.623" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="0.200" opacity="1">SKILLS</text>
<rect x="126.95" y="8.80" width="19.90" height="4.60" rx="0.8" fill="#DAD5CB" stroke="none" stroke-width="0.25"/>
<text x="136.90" y="11.90" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.623" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="0.200" opacity="1">EXPERIENCE</text>
<rect x="107.20" y="8.80" width="18.35" height="4.60" rx="0.8" fill="#DAD5CB" stroke="none" stroke-width="0.25"/>
<text x="116.37" y="11.90" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.623" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="0.200" opacity="1">EDUCATION</text>
<rect x="93.65" y="8.80" width="12.15" height="4.60" rx="0.8" fill="#DAD5CB" stroke="none" stroke-width="0.25"/>
<text x="99.72" y="11.90" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.623" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="0.200" opacity="1">ABOUT</text>
<text x="90.25" y="12.20" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.693" font-weight="500" fill="#5E5A54" text-anchor="end" letter-spacing="0.300" opacity="1">PAGE 2 / 2</text>
</g>
<g id="P2B_03_HEADER">
<text x="12.00" y="25.00" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="5.645" font-weight="200" fill="#141414" text-anchor="start" letter-spacing="0.400" opacity="1">COVER</text>
<text x="12.00" y="31.50" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="5.645" font-weight="200" fill="#141414" text-anchor="start" letter-spacing="0.400" opacity="1">LETTER</text>
<text x="66.00" y="25.00" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="1.905" font-weight="400" fill="#5E5A54" text-anchor="start" letter-spacing="0.000" opacity="1">왼쪽 여백의 표시 01–04 = 1페이지 강점 카드와 같은 이름</text>
</g>
<g id="P2B_04_TEXT">
<line x1="12.00" y1="36.00" x2="198.00" y2="36.00" stroke="#141414" stroke-width="0.35"/>
<text x="12.00" y="45.00" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="7.762" font-weight="200" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">01</text>
<text x="25.00" y="40.40" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.693" font-weight="600" fill="#5E5A54" text-anchor="start" letter-spacing="0.250" opacity="1">ABOUT ME · STRENGTHS</text>
<text x="12.00" y="50.00" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.258" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">본인을 소개하시오. 자신의 강점은</text>
<text x="12.00" y="53.16" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.258" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">무엇입니까?</text>
<text x="198.00" y="40.40" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="1.693" font-weight="400" fill="#5E5A54" text-anchor="end" letter-spacing="0.000" opacity="1">1156자</text>
<text x="66.00" y="46.40" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="3.704" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">〈틀을 배우고, 그 안을 채우는 건축학도〉</text>
<text x="66.00" y="55.12" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.499" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">① 본인 소개</text>
<text x="66.00" y="60.73" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">건물을 설계하던 감각으로 매장을 설계하려는 건축학도입니다. 5년제 건축학과의 설계 수업에서 다룬 건축은 대지와</text>
<text x="66.00" y="65.40" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">주변 건물과의 관계 속에서 &#x27;틀&#x27;을 정하는 일이었습니다. 그 틀 안의 실내 공간을 다룰 때 더 큰 흥미를 느껴, 4학년</text>
<text x="66.00" y="70.07" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">2학기에 휴학하고 공간 디자인으로 전향해 젠틀몬스터에 지원했습니다.</text>
<text x="66.00" y="78.48" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.499" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">② 강점</text>
<text x="12.00" y="83.77" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.835" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.300" opacity="1">01 PLANNING</text>
<text x="66.00" y="84.09" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">첫째, 기획입니다. 1학년부터 매 학기, 7학기 동안 설계 수업에서 리서치와 분석으로 컨셉을 세우고 그 컨셉을 건물로</text>
<text x="66.00" y="88.76" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">발전시켰습니다. 하나의 생각을 끝까지 형태로 밀고 가는 이 과정을 공간 기획에 가져가겠습니다.</text>
<text x="12.00" y="95.45" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.835" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.300" opacity="1">02 MAKING · TELLING</text>
<text x="66.00" y="95.77" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">둘째, 구현과 소통입니다. 수업에서는 컨셉을 다이어그램과 이미지로 옮겨 발표했습니다. 건축사사무소 인턴으로는</text>
<text x="66.00" y="100.44" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">현장을 실측해 모델링하고, 주변 대지와 프로젝트 건물을 구현했습니다. 2D부터 3D 모델링, 시각화, 후보정까지</text>
<text x="66.00" y="105.11" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">다룹니다. 오토캐드, 라이노, 엔스케이프, 포토샵, 일러스트, 인디자인을 씁니다. 매장 컨셉도 같은 방식으로 모델과</text>
<text x="66.00" y="109.79" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">이미지로 옮겨 전하겠습니다.</text>
<text x="12.00" y="116.48" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.835" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.300" opacity="1">03 SENSE</text>
<text x="66.00" y="116.80" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">셋째, 디자인적 감각입니다. 건축가도 디자이너라는 생각으로 시야를 넓혀 왔습니다. 학부 과정에서는 건물의 비례,</text>
<text x="66.00" y="121.47" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">이미지 표현, 색채를 다듬는 작업을 지향했고, 다양한 건축물을 다니며 실내 공간을 이루는 마감재와 가구, 조명을</text>
<text x="66.00" y="126.14" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">살폈습니다.</text>
<text x="66.00" y="133.15" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">원색 대신 채도를 낮춘 색으로 포인트를 주고 주변과 어우러지게 해, 가구와 조명 같은 오브제가 공간 속에서 하나의</text>
<text x="66.00" y="137.82" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">장면이 되게 하는 방식에 관심이 많습니다. 이 감각을 아트 오브제와 가구, 마감재를 기획하는 데 쓰겠습니다.</text>
<text x="12.00" y="144.51" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.835" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.300" opacity="1">04 RESTRAINT + BOLD</text>
<text x="66.00" y="144.83" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">절제된 비례와 색 조합에는 익숙합니다. 학부 시절 건축을 통해 절제된 디자인을 배워 왔기 때문입니다. 반면 과감한</text>
<text x="66.00" y="149.50" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">디자인은 아직 익숙하지 않아, 그쪽으로 폭을 넓혀 가려 합니다. 젠틀몬스터의 공간은 과감한 형태와 색의 디자인 언어를</text>
<text x="66.00" y="154.17" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">쓰기에, 그 언어 앞에서는 채워야 할 부분입니다. 그 일환으로서 스타일부터 변화하고 있습니다. 무채색 기반의 패션을</text>
<text x="66.00" y="158.85" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">컬러 포인트와 개성 있는 아이템으로 바꿔나가고 있습니다. 옷에서 시작한 이 변화를 실무까지 이어 가고 싶습니다.</text>
<text x="66.00" y="163.52" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">건축에서 익힌 절제 위에 과감을 더해, 절제와 과감을 한 공간에서 함께 다루고자 합니다.</text>
<text x="66.00" y="171.93" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.499" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">③ 포부</text>
<text x="12.00" y="177.22" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.835" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.300" opacity="1">VISION</text>
<text x="66.00" y="177.54" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">틀을 배운 건축학도에서, 스토어와 팝업 공간의 그 안을 채우는 젠틀몬스터의 공간 설계 디자이너가 되겠습니다.</text>
<line x1="12.00" y1="183.83" x2="198.00" y2="183.83" stroke="#141414" stroke-width="0.35"/>
<text x="12.00" y="192.83" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="7.762" font-weight="200" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">02</text>
<text x="25.00" y="188.23" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.693" font-weight="600" fill="#5E5A54" text-anchor="start" letter-spacing="0.250" opacity="1">WHY GENTLE MONSTER</text>
<text x="12.00" y="197.83" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.258" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">지원한 이유, 왜 젠틀몬스터여야 하는가?</text>
<text x="198.00" y="188.23" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="1.693" font-weight="400" fill="#5E5A54" text-anchor="end" letter-spacing="0.000" opacity="1">861자</text>
<text x="66.00" y="194.23" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="3.704" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">〈계단을 통로가 아닌 전시로 만든 곳〉</text>
<text x="66.00" y="202.95" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.499" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">① 지원한 이유</text>
<text x="66.00" y="208.55" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">젠틀몬스터 홍대 플래그십 스토어는 계단을 통로가 아닌 전시로 만든 곳이었습니다. 지난 9월, 개방된 저층부와 오브제가</text>
<text x="66.00" y="213.23" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">발걸음을 자연스럽게 안으로 이끌었고, 다음이 궁금해 넓은 1층을 지나 계단에 들어섰습니다. 작고 닫힌 계단은 형광빛</text>
<text x="66.00" y="217.90" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">색채를 띠었고, 길었지만 길게 느껴지지 않았습니다. 위층에 이르자 공간이 다시 넓게 열렸고, 지나온 구간은 단순한</text>
<text x="66.00" y="222.57" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">통로가 아닌 전시의 연장선이었습니다. 이 장면은 학부에서 마주했던 문제와 이어집니다. 좁은 부지에서 갤러리를 설계할</text>
<text x="66.00" y="227.24" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">때, 위아래로 긴 동선 속 단순한 층 이동은 관람자에게 좋지 않은 경험이 되기 쉬웠습니다. 그래서 리움미술관에 설치된</text>
<text x="66.00" y="231.92" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">올라퍼 엘리아슨의 &#x27;중력의 계단&#x27;을 참고해, 계단이 전시 공간의 연장선으로 느껴지도록 계획했습니다. 그 문제를</text>
<text x="66.00" y="236.59" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">매장에서 풀어낸 홍대의 계단을 보고, 그런 곳을 만드는 쪽에 서고 싶어졌습니다.</text>
<text x="66.00" y="245.00" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.499" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">② 왜 젠틀몬스터여야 하는가</text>
<text x="66.00" y="250.61" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">공간 설계 디자이너는 이용자의 경험을 먼저 설계하는 직무라고 생각합니다. 상업시설이라면 저층부에 제품을 두어</text>
<text x="66.00" y="255.28" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">매출을 높이려 할 것입니다. 그런데 젠틀몬스터는 1층 전체를 전시 공간으로 내주고, 오브제로 이끈 발걸음을 위층까지</text>
<text x="66.00" y="259.95" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">하나의 이야기로 이었습니다. 온라인과 AI로 제품을 사고 착용해 보는 시대에, 오프라인 매장은 직접 걸으며 그 이야기를</text>
<text x="66.00" y="264.62" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">겪는 곳이어야 합니다. 젠틀몬스터에서 설계하고 싶은 공간은, 안경이든 브랜드든 주인공을 돋보이게 하는 무대입니다.</text>
<text x="66.00" y="269.30" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">오브제와 색채, 동선이 한 장면으로 어우러져, 이용자가 멈추고, 이끌리고, 나선 뒤에도 기억하는 곳입니다. 계단에서</text>
<text x="66.00" y="273.97" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.717" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">시작한 질문을 입구와 통로, 매장의 모든 구간으로 넓혀, 지나치는 곳 없이 전시가 되는 공간을 설계하겠습니다.</text>
</g>
