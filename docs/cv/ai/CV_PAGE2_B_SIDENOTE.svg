<text x="25.00" y="40.40" font-family="Inter, 'Noto Sans CJK KR', sans-serif" font-size="1.693" font-weight="600" fill="#5E5A54" text-anchor="start" letter-spacing="0.250" opacity="1">WHY GENTLE MONSTER</text>
<text x="12.00" y="50.00" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="2.258" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.000" opacity="1">지원한 이유, 왜 젠틀몬스터여야 하는가?</text>
<text x="198.00" y="40.40" font-family="'Noto Sans CJK KR', Inter, sans-serif" font-size="1.693" font-weight="400" fill="#5E5A54" text-anchor="end" letter-spacing="0.000" opacity="1">원고 보류 중 · 1000자 이내 자리</text>
