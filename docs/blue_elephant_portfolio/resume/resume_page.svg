  <g id='SKILLS'><text x='172' y='612' class='h2' text-anchor='start'>Skills</text><rect x='172' y='652' width='34' height='34' rx='5' fill='none' stroke='#6B6B6B' stroke-width='1.6'/><text x='189' y='675.5' class='mk' text-anchor='middle'>Ps</text><text x='231' y='674' class='sk' text-anchor='start'>Photoshop</text><text x='346' y='674' class='skd' text-anchor='start'>Retouching</text><rect x='172' y='698' width='34' height='34' rx='5' fill='none' stroke='#6B6B6B' stroke-width='1.6'/><text x='189' y='721.5' class='mk' text-anchor='middle'>Ai</text><text x='231' y='720' class='sk' text-anchor='start'>Illustrator</text><text x='346' y='720' class='skd' text-anchor='start'>Vector graphics</text><rect x='172' y='744' width='34' height='34' rx='5' fill='none' stroke='#6B6B6B' stroke-width='1.6'/><text x='189' y='767.5' class='mk' text-anchor='middle'>Id</text><text x='231' y='766' class='sk' text-anchor='start'>InDesign</text><text x='346' y='766' class='skd' text-anchor='start'>Editorial layout</text><rect x='172' y='790' width='34' height='34' rx='5' fill='none' stroke='#6B6B6B' stroke-width='1.6'/><text x='189' y='813.5' class='mk' text-anchor='middle'>Ac</text><text x='231' y='812' class='sk' text-anchor='start'>AutoCAD</text><text x='346' y='812' class='skd' text-anchor='start'>2D drawing</text><rect x='172' y='836' width='34' height='34' rx='5' fill='none' stroke='#6B6B6B' stroke-width='1.6'/><text x='189' y='859.5' class='mk' text-anchor='middle'>Rh</text><text x='231' y='858' class='sk' text-anchor='start'>Rhino</text><text x='346' y='858' class='skd' text-anchor='start'>3D modeling</text><rect x='172' y='882' width='34' height='34' rx='5' fill='none' stroke='#6B6B6B' stroke-width='1.6'/><text x='189' y='905.5' class='mk' text-anchor='middle'>En</text><text x='231' y='904' class='sk' text-anchor='start'>Enscape</text><text x='346' y='904' class='skd' text-anchor='start'>Rendering</text><rect x='470' y='652' width='34' height='34' rx='5' fill='none' stroke='#6B6B6B' stroke-width='1.6'/><text x='487' y='675.5' class='mk' text-anchor='middle'>Ko</text><text x='529' y='674' class='sk' text-anchor='start'>Korean</text><text x='644' y='674' class='skd' text-anchor='start'>Native</text><rect x='470' y='698' width='34' height='34' rx='5' fill='none' stroke='#6B6B6B' stroke-width='1.6'/><text x='487' y='721.5' class='mk' text-anchor='middle'>En</text><text x='529' y='720' class='sk' text-anchor='start'>English</text><text x='644' y='720' class='skd' text-anchor='start'>Research reading</text><rect x='470' y='790' width='34' height='34' rx='5' fill='none' stroke='#6B6B6B' stroke-width='1.6'/><text x='487' y='813.5' class='mk' text-anchor='middle'>AI</text><text x='529' y='812' class='sk' text-anchor='start'>AI imaging</text><text x='644' y='812' class='skd' text-anchor='start'>Image generation</text><rect x='470' y='836' width='34' height='34' rx='5' fill='none' stroke='#6B6B6B' stroke-width='1.6'/><g transform='translate(477 843) scale(.83)' fill='none' stroke='#6B6B6B' stroke-width='2'><rect x='2' y='6' width='20' height='14' rx='3'/><circle cx='12' cy='13' r='4'/><path d='M8 6l2-3h4l2 3'/></g><text x='529' y='858' class='sk' text-anchor='start'>Photography</text></g>
  <g id='EXPERIENCES'><text x='920' y='178' class='h2' text-anchor='start'>Experiences</text><text x='920' y='262' class='org' text-anchor='start'>A.CO.LAB</text><text x='920' y='287' class='role' text-anchor='start'>Architecture Office Intern  |  August 2026</text><text x='920' y='322' class='body' text-anchor='start'>Site survey and 3D modeling of the surrounding site and project buildings.</text><text x='920' y='342' class='body' text-anchor='start'>Built a physical model shown at Culture Station Seoul 284, &#39;Design of Care&#39;.</text><text x='920' y='414' class='org' text-anchor='start'>UNIVERSITY OF SEOUL</text><text x='920' y='439' class='role' text-anchor='start'>Design Studio  |  2020 – 2026</text><text x='920' y='474' class='body' text-anchor='start'>Seven studios, from the city to the room: an urban plaza, a courtyard between buildings,</text><text x='920' y='494' class='body' text-anchor='start'>a corridor joining two masses, and a section of the hollow beneath the city.</text><text x='920' y='566' class='org' text-anchor='start'>CAFÉ</text><text x='920' y='591' class='role' text-anchor='start'>Part-time  |  August – November 2024</text><text x='920' y='626' class='body' text-anchor='start'>Built a grid storage system in the basement, sorting stock by item.</text><text x='920' y='646' class='body' text-anchor='start'>Rearranged tables and plants in the hall to divide sightlines and open up the space.</text><text x='920' y='718' class='org' text-anchor='start'>HABITAT FOR HUMANITY</text><text x='920' y='743' class='role' text-anchor='start'>Volunteer  |  2024 – 2025</text><text x='920' y='778' class='body' text-anchor='start'>Renovated an old home with new wallpaper and paint, working on site within a set budget.</text><text x='920' y='870' class='org' text-anchor='start'>REPUBLIC OF KOREA ARMY</text><text x='920' y='895' class='role' text-anchor='start'>Sergeant  |  2022 – 2024</text><text x='920' y='930' class='body' text-anchor='start'>Completed full-term military service and received two commendations.</text></g>
